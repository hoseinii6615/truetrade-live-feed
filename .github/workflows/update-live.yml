name: Mirror TrueTrade V4 Live Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

concurrency:
  group: truetrade-v4-live-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Wait for fresh complete V4 snapshot
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://tight-flower-7ee6.hoseinii6615.workers.dev"
          RAW_BASE="https://raw.githubusercontent.com/hoseinii6615/truetrade-live-feed/main/live"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir -p live

          fetch_json() {
            curl -fsSL --connect-timeout 15 --max-time 60 \
              --retry 3 --retry-delay 2 --retry-all-errors "$1"
          }

          ok=0
          for attempt in $(seq 1 18); do
            echo "Attempt $attempt/18"
            if fetch_json "$BASE/health?format=json" > "$WORK/health.json" \
              && fetch_json "$BASE/live?format=json" > "$WORK/live.json"; then
              jq -e . "$WORK/health.json" >/dev/null
              jq -e . "$WORK/live.json" >/dev/null
              if jq -e '
                .type == "TRUETRADE_LIVE_SNAPSHOT_V4"
                and (.market_count > 0)
                and (.observed_count == .market_count)
                and (.data_error_count == 0)
                and (.complete_universe == true)
                and (.current_15m_candle_covered_count == .market_count)
                and (.fresh_for_latest_15m_closed_candle == true)
                and (.closed_candles_only == true)
                and (
                  (.strict_frame_coverage == null)
                  or (
                    .strict_frame_coverage["15m"] == .market_count
                    and .strict_frame_coverage["1h"] == .market_count
                    and .strict_frame_coverage["4h"] == .market_count
                  )
                )
              ' "$WORK/live.json" >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 10
          done

          if (( ok != 1 )); then
            echo "No fresh complete V4 snapshot. Previous good mirror remains unchanged."
            exit 1
          fi

          cp "$WORK/live.json" live/market-scan.json
          cp "$WORK/health.json" live/health.json

          MIRROR_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          SOURCE_AT="$(jq -r '.generated_at' "$WORK/live.json")"
          TARGET="$(jq -r '.target_15m_closed_time' "$WORK/live.json")"
          MARKET_COUNT="$(jq -r '.market_count' "$WORK/live.json")"
          READY_COUNT="$(jq -r '.ready_count' "$WORK/live.json")"

          jq -n \
            --arg mirror_generated_at "$MIRROR_AT" \
            --arg source_generated_at "$SOURCE_AT" \
            --arg raw_base "$RAW_BASE" \
            --arg worker "$BASE" \
            --argjson target_15m_closed_time "$TARGET" \
            --argjson market_count "$MARKET_COUNT" \
            --argjson ready_count "$READY_COUNT" \
            '{
              type: "TRUETRADE_GITHUB_MIRROR_V4",
              source: "TheTrueTrade via Cloudflare Worker V4",
              mirror_generated_at: $mirror_generated_at,
              source_generated_at: $source_generated_at,
              target_15m_closed_time: $target_15m_closed_time,
              market_count: $market_count,
              observed_count: $market_count,
              ready_count: $ready_count,
              data_error_count: 0,
              complete_universe: true,
              closed_candles_only: true,
              verified_fresh_at_mirror_time: true,
              market_scan: ($raw_base + "/market-scan.json"),
              health: ($raw_base + "/health.json"),
              source_worker: ($worker + "/live?format=json"),
              note: "Reject this mirror if target_15m_closed_time is not the latest fully closed 15m candle at read time."
            }' > live/manifest.json

      - name: Publish mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TrueTrade Bot"
          git config user.email "truetrade-bot@users.noreply.github.com"
          git add live/manifest.json live/market-scan.json live/health.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Mirror fresh TrueTrade V4 snapshot"
          git push
